name: matematik
description: Matematik Macerasi iOS ve Android uygulamasi.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'

dependencies:
  cloud_firestore: ^6.3.0
  firebase_app_check: 0.4.4+2
  firebase_auth: ^6.4.0
  firebase_core: 4.10.0
  # Match firebase_core 4.10.0's 14-field iOS Pigeon codec.
  firebase_core_platform_interface: 7.0.1
  firebase_storage: ^13.3.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-icon-master.png
    - assets/branding/splash-island.png
