name: matematik
description: Matematik Macera Evreni iOS ve Android uygulamasi.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'

dependencies:
  cloud_firestore: ^6.3.0
  cloud_functions: 6.3.2
  firebase_app_check: 0.4.4+2
  firebase_auth: ^6.4.0
  firebase_core: 4.10.0
  # Match firebase_core 4.10.0's 14-field iOS Pigeon codec.
  firebase_core_platform_interface: 7.0.1
  firebase_storage: ^13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-icon-master.png
    - assets/branding/splash-island.png
    - assets/home/adventure-archipelago.png
    - assets/home/adventure-archipelago-v2.png
    - assets/fonts/Nunito-OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
