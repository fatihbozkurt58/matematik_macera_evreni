name: Capture Flutter Screenshots
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to capture
        required: true
        type: choice
        options: [both, android, ios]
        default: both
permissions:
  contents: read
jobs:
  android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --flavor dev -t lib/screenshot_main.dart
      - name: Capture Android login screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p screenshots
            adb install -r build/app/outputs/flutter-apk/app-dev-debug.apk
            adb shell monkey -p com.fatihbozkurt.matematik.dev 1
            sleep 12
            adb shell dumpsys activity activities | grep -q com.fatihbozkurt.matematik.dev
            adb exec-out screencap -p > screenshots/android-login.png
            test -s screenshots/android-login.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-login
          path: screenshots/*.png
          if-no-files-found: warn
  ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Select iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          devices=[d for group in data['devices'].values() for d in group
                   if d.get('isAvailable') and 'iPhone' in d['name']]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SIMULATOR_UDID='+devices[0]['udid']+'\n')
          print('Selected:',devices[0]['name'])
          PY
      - name: Boot selected iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - run: flutter build ios --simulator --flavor dev -t lib/screenshot_main.dart
      - name: Capture iOS login screen
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=build/ios/iphonesimulator/Runner.app
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"
          sleep 12
          mkdir -p screenshots
          xcrun simctl io "$SIMULATOR_UDID" screenshot screenshots/ios-login.png
          test -s screenshots/ios-login.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-login
          path: screenshots/*.png
          if-no-files-found: warn
